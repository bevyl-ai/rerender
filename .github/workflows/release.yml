# Publishes to npm on every v* tag push, after re-running the fast verification gate.
#
# Auth is trusted publishing (OIDC), so there is no npm token anywhere in this repo.
# Configure it once, in the package's settings on npmjs.com, as a GitHub Actions
# trusted publisher:
#
#   Organization or user  bevyl-ai
#   Repository            rerender
#   Workflow filename     release.yml
#   Allowed actions       npm publish
#   Environment           (leave empty — this workflow uses none)
#
# npm exchanges the job's id-token for a short-lived credential and attaches
# provenance. Requires npm >=11.5.1 and Node >=22.14, which the steps below pin.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # npm provenance + OIDC trusted publishing

jobs:
  publish:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14'  # OIDC exchange needs >=22.14
          cache: npm
          registry-url: 'https://registry.npmjs.org'
      # setup-node's bundled npm predates OIDC trusted publishing, which landed in 11.5.1.
      - run: npm install -g npm@latest
      - run: npm ci
      - name: Verify
        run: npm run typecheck && npm run check && npm run test:extract && npm run build:lib && npm run publint && npm run attw
      - name: Tag matches package version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "v$PKG_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match package version v$PKG_VERSION"
            exit 1
          fi
      # No NODE_AUTH_TOKEN. setup-node writes _authToken=${NODE_AUTH_TOKEN} into .npmrc, and an
      # unset secret expands to an empty string — npm then authenticates as nobody and gets a 401
      # instead of falling through to OIDC. Absent is the working configuration; empty is not.
      - name: Publish (prepack builds dist + runs the license guard)
        run: npm publish --provenance --access public
