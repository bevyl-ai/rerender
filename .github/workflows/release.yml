# Publishes to npm on every push to main whose package.json version is not on the registry yet.
#
# So a release is: bump the version in a PR, merge it. No tags to remember — the registry is the
# source of truth for what has shipped, and merges that don't touch the version publish nothing.
#
# Auth is trusted publishing (OIDC): no token anywhere in this repo. Configured once on npmjs.com
# (package settings -> Trusted Publisher -> GitHub Actions):
#
#   Organization or user  bevyl-ai
#   Repository            rerender
#   Workflow filename     release.yml   <- this filename is part of the npm-side config
#   Allowed actions       npm publish
#   Environment           (empty)
#
# npm exchanges the job's id-token for a short-lived credential and attaches provenance.
# Requires npm >=11.5.1 and Node >=22.14, which the steps below pin.
name: release

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write # OIDC trusted publishing + provenance

# One release run at a time, in order — two quick merges must not race the registry check.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14' # OIDC exchange needs >=22.14
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      # The registry decides. Before spending CI on the verify gate: if this version is already
      # published, the merge wasn't a release and the job ends here.
      - name: Is this version already on npm?
        id: gate
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if npm view "@bevyl-ai/rerender@$VERSION" version >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "@bevyl-ai/rerender@$VERSION is already published — nothing to do"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "@bevyl-ai/rerender@$VERSION is new — releasing"
          fi

      # setup-node's bundled npm predates OIDC trusted publishing, which landed in 11.5.1.
      - if: steps.gate.outputs.publish == 'true'
        run: npm install -g npm@latest
      - if: steps.gate.outputs.publish == 'true'
        run: npm ci
      - name: Verify
        if: steps.gate.outputs.publish == 'true'
        run: npm run typecheck && npm run check && npm run test:extract && npm run build:lib && npm run publint && npm run attw

      # No NODE_AUTH_TOKEN. setup-node writes _authToken=${NODE_AUTH_TOKEN} into .npmrc, and an
      # unset secret expands to an empty string — npm then authenticates as nobody and gets a 401
      # instead of falling through to OIDC. Absent is the working configuration; empty is not.
      - name: Publish (prepack builds dist + runs the license guard)
        if: steps.gate.outputs.publish == 'true'
        run: npm publish --provenance --access public
