name: deploy

# Builds the demo (demo/ → vite build → dist/) and ships it to the rerender-demo
# Cloudflare Worker — which serves https://rerender.video — on every push to main.
# Requires repo secrets: CLOUDFLARE_API_TOKEN (Workers-scoped) + CLOUDFLARE_ACCOUNT_ID.
on:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push to main supersedes an in-flight deploy.
concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun ci
      - run: bun run build
      # wranglerVersion must track the `wrangler` devDependency. Left to itself the action
      # installs its own build — it picked 3.90.0, which does not know `assets.run_worker_first`
      # and silently dropped it with only a warning ("Unexpected fields found in assets field").
      # The Worker uploaded fine and then never ran, because assets are served before it.
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.123.0'
